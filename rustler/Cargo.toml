[package]
name = "rustler"
version = "1.8.0"
license = "MIT"
description = "Native data-processing engine for the Relational Transformer (rt.rustler)."
repository = "https://github.com/stanford-star/relational-transformer"
edition = "2024"

[lib]
name = "rustler"
crate-type = ["cdylib"]

# One feature, and nothing anybody builds routinely needs to know about it:
# `vecdb` is opt-in FAISS-similarity seed selection in the Sampler, and it is
# opt-in because FAISS needs cmake and a BLAS that this environment does not
# carry. Everything else -- the Sampler and the preprocessor alike -- is built
# unconditionally, so there is exactly one build and it has everything in it.
[features]
default = []
vecdb = ["dep:faiss"]

# Every requirement is the major the crate is written against, not `*`. A
# wildcard resolves to whatever major exists on the build day, which an
# incremental local build never notices -- the installed environment was linked
# against the old one -- and a fresh build hits immediately. Taken literally
# today, `*` moves pyo3 0.24 -> 0.29 and polars 0.46 -> 0.55, and the crate
# stops compiling: `PyObject` moved, `Python::allow_threads` is gone,
# `DataFrame::iter` is gone, `TimeUnit` no longer derefs. That is the path a
# reader installing the sdist takes, so it is the path that must be pinned.
# Bumping a major here is a deliberate, tested change.
[dependencies]
polars = { version = "0.46", features = [
    "parquet",
    "lazy",
    "dtype-categorical",
] }
chrono = "0.4"
serde_yaml = "0.9"
serde_json = "1.0"
glob = "0.3"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
rand = "0.9.1"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.24", features = ["abi3-py310"] }
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["pointer_width_64"] }
# Must track pyo3's major: numpy 0.24 is the release built against pyo3 0.24,
# and a mismatch is a type error on every `PyArray` boundary.
numpy = { version = "0.24", features = ["half"] }
indicatif = "0.17"
half = { version = "2.5", features = ["rkyv"] }
rayon = "1.10"
dashmap = "6.1"
faiss = { version = "0.13", features = ["static"], optional = true }
