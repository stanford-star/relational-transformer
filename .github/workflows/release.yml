name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - runner: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - runner: macos-14
            target: aarch64
            manylinux: "auto"
          - runner: macos-14
            target: x86_64
            manylinux: "auto"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          test "$version" = "$tag" || {
            echo "pyproject version $version does not match tag $tag"
            exit 1
          }

  check:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install twine packaging
      - run: twine check --strict dist/*
      - run: ls -l dist
      - run: |
          python - <<'EOF'
          import glob, zipfile
          from email.parser import BytesParser
          from packaging.requirements import Requirement

          bad = []
          for whl in glob.glob("dist/*.whl"):
              z = zipfile.ZipFile(whl)
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = BytesParser().parsebytes(z.read(name))
              for raw in meta.get_all("Requires-Dist") or []:
                  if Requirement(raw).url is not None:
                      bad.append(f"{whl}: {raw}")
          if bad:
              raise SystemExit(
                  "PyPI rejects a distribution whose Requires-Dist carries a direct "
                  "URL reference:\n" + "\n".join(bad)
              )
          EOF

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist, check, tag-matches-version]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
