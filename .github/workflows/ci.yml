name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin
      - run: maturin build --release --out dist
      # The CUDA wheel's nvidia-* dependencies do not fit on a hosted runner's
      # disk, and there is no GPU here to use them. Resolving torch from the
      # CPU index first is what makes `pip install dist/*.whl` fit.
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir dist/*.whl
      - run: pip install pytest
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist

  # The lint scope lives in `[tool.ruff]` in `pyproject.toml`, not here: passing
  # paths as `args` does not replace this action's `src` default, it appends to
  # it, so a path list here would silently lint the excluded tree as well.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: format --check
