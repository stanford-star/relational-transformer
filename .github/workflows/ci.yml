name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a superseded run is checking a tree that no longer exists,
# and the only verdict anyone acts on is the tip's. A `workflow_dispatch` run
# gets a group of its own (`github.run_id` is unique), so a manual run is never
# cancelled by the next push.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # The lint scope lives in `[tool.ruff]` in `pyproject.toml`, not here: passing
  # paths as `args` does not replace this action's `src` default, it appends to
  # it, so a path list here would silently lint the excluded tree as well.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: format --check
